# Personal fork packaging: build Windows + macOS installers on push.
# Official Zed workflows were removed from this fork; only this file remains.
#
# Triggers:
#   - push to main
#   - workflow_dispatch (Actions → Run workflow)
#
# Outputs: Actions artifacts (DMG / EXE). Unsigned unless signing secrets are set.
name: release_fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  # Avoid Node 20 deprecation noise from older JS actions on newer runners.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Regular files only for agent docs; do not restore a long-target symlink.
          persist-credentials: false

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(script/get-crate-version zed)"
          CHANNEL="$(tr -d '[:space:]' < crates/zed/RELEASE_CHANNEL)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Building version=$VERSION channel=$CHANNEL for ${{ github.repository }} @ ${{ github.sha }}"

  bundle_mac_aarch64:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 180
    env:
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release channel file
        run: echo "${{ needs.prepare.outputs.channel }}" > crates/zed/RELEASE_CHANNEL

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bundle macOS (aarch64)
        run: ./script/bundle-mac aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: Zed-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error

  bundle_mac_x86_64:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 180
    env:
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release channel file
        run: echo "${{ needs.prepare.outputs.channel }}" > crates/zed/RELEASE_CHANNEL

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bundle macOS (x86_64)
        run: ./script/bundle-mac x86_64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: Zed-x86_64.dmg
          path: target/x86_64-apple-darwin/release/Zed-x86_64.dmg
          if-no-files-found: error

  bundle_windows_x86_64:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release channel file
        shell: bash
        run: echo "${{ needs.prepare.outputs.channel }}" > crates/zed/RELEASE_CHANNEL

      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none
          }
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Bundle Windows (x86_64)
        shell: pwsh
        run: |
          $env:ZED_WORKSPACE = (Resolve-Path .).Path
          $env:CI = "true"
          script/bundle-windows.ps1 -Architecture x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: Zed-x86_64.exe
          path: target/Zed-x86_64.exe
          if-no-files-found: error

  bundle_windows_aarch64:
    needs: prepare
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release channel file
        shell: bash
        run: echo "${{ needs.prepare.outputs.channel }}" > crates/zed/RELEASE_CHANNEL

      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none
          }
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup show
          rustup target add aarch64-pc-windows-msvc

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup ISCC.exe not found after install"
          }

      - name: Bundle Windows (aarch64)
        shell: pwsh
        run: |
          $env:ZED_WORKSPACE = (Resolve-Path .).Path
          $env:CI = "true"
          script/bundle-windows.ps1 -Architecture aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: Zed-aarch64.exe
          path: target/Zed-aarch64.exe
          if-no-files-found: error
